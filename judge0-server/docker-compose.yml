x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /box:/box:rw
      - /dev/null:/dev/null:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/cgroup/memory:/sys/fs/cgroup/memory:rw
      - /sys/fs/cgroup/cpuacct:/sys/fs/cgroup/cpuacct:rw
      - /sys/fs/cgroup/cpu:/sys/fs/cgroup/cpu:rw
    ports:
      - "2358:2358"
    privileged: true
    security_opt:
      - seccomp:unconfined
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /box:/box:rw
      - /dev/null:/dev/null:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/cgroup/memory:/sys/fs/cgroup/memory:rw
      - /sys/fs/cgroup/cpuacct:/sys/fs/cgroup/cpuacct:rw
      - /sys/fs/cgroup/cpu:/sys/fs/cgroup/cpu:rw
    privileged: true
    security_opt:
      - seccomp:unconfined
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
